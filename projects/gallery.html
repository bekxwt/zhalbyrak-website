<style>
body {
    margin: 0;
    background: #0d0d0d;
    font-family: Arial, sans-serif;
    color: white;
}

/* HEADER */

header {
    text-align:center;
    padding:40px 20px;
}

header h1 {
    font-size:2.2rem;
}

header p {
    color:#aaa;
}

/* FILTERS */

.filters {
    margin-top:25px;
}

.filters button {
    background:#1a1a1a;
    color:white;
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

.filters button.active {
    background:white;
    color:black;
}

/* GALLERY */

.gallery {

    column-count:4;
    column-gap:15px;
    padding:20px;

}

.item {

    break-inside:avoid;
    margin-bottom:15px;
}

.item img,
.item iframe {

    width:100%;
    display:block;
    border-radius:12px;
}

.item iframe {

    aspect-ratio:16/9;
    border:none;

}

/* HOVER */

.item img {

    transition:0.3s ease;
    cursor:pointer;

}

.item:hover img {

    transform:scale(1.03);
    filter:brightness(1.1);

}

/* LIGHTBOX */

#lightbox {

    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.9);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:1000;

}

#lightbox img {

    max-width:90%;
    max-height:90%;

    border-radius:12px;

}

/* BACK BUTTON */

.back-link {

    position:fixed;

    top:20px;
    left:20px;

    z-index:1100;

    color:white;

    text-decoration:none;

    background:rgba(255,255,255,0.1);

    padding:10px 15px;

    border-radius:8px;

    backdrop-filter:blur(5px);

}

@media(max-width:1200px){

.gallery{
    column-count:3;
}

}

@media(max-width:800px){

.gallery{
    column-count:2;
}
}

@media(max-width:500px){

.gallery{
    column-count:1;
}
}
</style>
</head>

<script>

// FILTERS

const buttons=document.querySelectorAll(".filters button");

const items=document.querySelectorAll(".item");


buttons.forEach(button=>{


button.onclick=()=>{


buttons.forEach(b=>b.classList.remove("active"));

button.classList.add("active");


const filter=button.dataset.filter;



items.forEach(item=>{


item.style.display =
(filter==="all" || item.classList.contains(filter))
?
"block"
:
"none";
});
};
});
// LIGHTBOX

const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

document.querySelectorAll(".item img").forEach(img=>{


img.onclick=()=>{
lightbox.style.display="flex";
lightboxImg.src=img.src;
};
});

lightbox.onclick=()=>{
lightbox.style.display="none";
};


</script>
